{% extends 'base.html' %}{% block title %}اختبار الأنمي{% endblock %}{% block content %}<section class="panel quiz-panel"><div class="eyebrow">MISSION 01 / KNOWLEDGE CHECK</div><div class="quiz-head"><span id="counter">السؤال 1 من 20</span><span class="timer">⏱ <b id="timer">15</b></span></div><div class="progress"><span id="progress"></span></div><h1 id="question"></h1><div id="answers" class="answers"></div><p class="tiny">لك 15 ثانية لكل سؤال. لن تظهر صحة إجابتك أثناء الاختبار، ولا يمكن إعادة المحاولة.</p><button id="next" class="primary" disabled>التالي ←</button><div id="result" hidden></div></section>{% endblock %}{% block scripts %}<script>
const questions={{ questions|tojson }};let idx=0,answers=Array(questions.length).fill(-1),remaining=15,interval=null,locked=false;const startedAt=Date.now()/1000;
const qEl=document.getElementById('question'),aEl=document.getElementById('answers'),timerEl=document.getElementById('timer'),nextBtn=document.getElementById('next');
function render(){locked=false;remaining=15;timerEl.textContent=remaining;document.getElementById('counter').textContent=`السؤال ${idx+1} من ${questions.length}`;document.getElementById('progress').style.width=`${idx/questions.length*100}%`;qEl.textContent=questions[idx].q;aEl.innerHTML='';questions[idx].a.forEach((a,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>choose(i);aEl.appendChild(b)});nextBtn.disabled=true;nextBtn.textContent=idx===questions.length-1?'إنهاء الاختبار':'التالي ←';clearInterval(interval);interval=setInterval(()=>{remaining--;timerEl.textContent=remaining;if(remaining<=0){clearInterval(interval);if(!locked){locked=true;nextBtn.disabled=false;Array.from(aEl.children).forEach(b=>b.disabled=true)}}},1000)}
function choose(i){if(locked)return;locked=true;answers[idx]=i;Array.from(aEl.children).forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('selected')});clearInterval(interval);nextBtn.disabled=false}
nextBtn.onclick=()=>{if(!locked)return;if(idx<questions.length-1){idx++;render()}else finish()};
async function finish(){nextBtn.disabled=true;nextBtn.textContent='جارٍ تسجيل النتيجة...';try{const r=await fetch('/api/quiz/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers,started_at:startedAt})});const data=await r.json();if(!r.ok)throw new Error(data.error||'تعذر تسجيل النتيجة');document.querySelector('.quiz-head').hidden=true;document.querySelector('.progress').hidden=true;qEl.textContent='اكتملت المهمة';aEl.innerHTML=`<div class="result-card"><div class="eyebrow">MISSION COMPLETE</div><strong>${data.score} / 20</strong><p>ترتيبك بين المشاركين الذين أكملوا الاختبار: <b>${data.rank}</b> من <b>${data.total}</b>.</p><p class="muted">لا تُعرض أسماء المشاركين الآخرين.</p><a class="primary link-button" href="/dashboard">العودة للبوابة</a></div>`;nextBtn.hidden=true;document.querySelector('.tiny').hidden=true;document.getElementById('progress').style.width='100%'}catch(e){alert(e.message);nextBtn.disabled=false;nextBtn.textContent='إعادة الإرسال';nextBtn.onclick=finish}}
render();
</script>{% endblock %}
